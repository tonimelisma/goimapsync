name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel stale PR runs; never cancel push or manual runs.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Same entry point as local work: format, lint, build, vet, race tests.
  # The end-to-end test has its own workflow, which pull requests never run
  # (e2e.yml, D193).
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      # Built from source with the project's Go version (same as the cloud
      # session hook), so it can type-check the language version in go.mod.
      - name: Install golangci-lint
        run: |
          set -euo pipefail
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Check
        run: script/check.sh
