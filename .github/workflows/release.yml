name: Release

# Publishes a release of main's head (D187, D194): checks it, tags it,
# builds it with script/release.sh and uploads the binaries, SHA256SUMS and a
# signed build provenance attestation (D197). The build is reproducible and
# uses no cache, and the job holds no secret beyond GITHUB_TOKEN.
# Cloud sessions start it with
#   gh api repos/tonimelisma/goimapsync/dispatches -f event_type=release \
#     -f 'client_payload[version]=vX.Y.Z' -f 'client_payload[notes]=NOTES'
# Without notes, GitHub writes them from the merged pull requests.
# A new version must be higher than every existing tag. Running it again for
# an existing tag only finishes that release; it never moves the tag.
on:
  repository_dispatch:
    types: [release]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, such as v1.2.3
        required: true
      notes:
        description: Release notes (Markdown)
        required: false

run-name: release ${{ github.event.client_payload.version || inputs.version }}

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  # Keyless Sigstore signing of the build provenance.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ github.event.client_payload.version || inputs.version }}
      NOTES: ${{ github.event.client_payload.notes || inputs.notes }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Choose commit
        id: plan
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release: version must look like v1.2.3" >&2
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/$VERSION" >/dev/null; then
            echo "release: tag $VERSION exists; finishing its release"
            echo "new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # v0.1.2 was released before the repository restarted (D196).
          highest=$({ echo v0.1.2; git tag --list 'v[0-9]*.[0-9]*.[0-9]*'; } | sort -V | tail -n 1)
          if [[ "$(printf '%s\n%s\n' "$highest" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" || "$VERSION" == "$highest" ]]; then
            echo "release: $VERSION is not higher than $highest" >&2
            exit 1
          fi
          echo "new=true" >> "$GITHUB_OUTPUT"

      # No cache: a release is built from the tag and the module proxy only.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install golangci-lint
        if: steps.plan.outputs.new == 'true'
        run: |
          set -euo pipefail
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Check
        if: steps.plan.outputs.new == 'true'
        run: script/check.sh

      - name: Tag
        if: steps.plan.outputs.new == 'true'
        run: |
          set -euo pipefail
          git tag "$VERSION"
          git push origin "refs/tags/$VERSION"

      - name: Build
        run: |
          set -euo pipefail
          git checkout --quiet "refs/tags/$VERSION"
          script/release.sh "$VERSION"

      - name: Attest
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/pimvault-*-linux-*

      # The same attestation as a release asset, for verifying offline.
      - name: Add attestation bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/pimvault-$VERSION.sigstore.json"

      # A run that stopped halfway can leave a draft with some assets: it
      # gets this build's assets, whose SHA256SUMS matches them, and is
      # published.
      - name: Publish
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY/releases"
          id=$(gh api "$api" --paginate --jq ".[] | select(.tag_name == \"$VERSION\") | .id" | head -n 1)
          if [[ -z "$id" ]]; then
            if [[ -n "$NOTES" ]]; then
              printf '%s\n' "$NOTES" >"$RUNNER_TEMP/notes.md"
              notes=(--notes-file "$RUNNER_TEMP/notes.md")
            else
              notes=(--generate-notes)
            fi
            gh release create "$VERSION" --verify-tag --title "pimvault $VERSION" "${notes[@]}" dist/*
            exit 0
          fi
          have=$(gh api "$api/$id" --jq '.assets[].name' | sort)
          want=$(cd dist && ls | sort)
          if [[ "$have" != "$want" ]]; then
            gh release upload "$VERSION" --clobber dist/*
          fi
          if [[ "$(gh api "$api/$id" --jq .draft)" == true ]]; then
            gh api -X PATCH "$api/$id" -F draft=false >/dev/null
          fi
          echo "release: $VERSION is published"
