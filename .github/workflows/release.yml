name: Release

# Publishes a release after every merge to main (D198): when the CI run of a
# push to main succeeds, it checks the tested commit, tags it with the next
# patch version, builds it with script/release.sh and uploads the binaries,
# SHA256SUMS and a signed build provenance attestation (D197). The build is
# reproducible and uses no cache, and the job holds no secret beyond
# GITHUB_TOKEN. Only this workflow, run on main, publishes or attests
# releases; consumers verify with --signer-workflow and --source-ref
# refs/heads/main. Nothing runs on tag pushes.
#
# A manual run (workflow_dispatch on main only) releases main's head, as the
# given version or the next patch version. A version must be higher than
# every existing tag and v0.1.2 (D196). Running it again for a tagged commit
# or an existing tag only finishes that release; it never moves a tag.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, such as v1.2.3 (default the next patch version)
        required: false
      notes:
        description: Release notes (Markdown; default generated from the merged pull requests)
        required: false

run-name: release ${{ inputs.version || github.event.workflow_run.head_sha || github.sha }}

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  # Keyless Sigstore signing of the build provenance.
  id-token: write
  attestations: write

jobs:
  release:
    # Only a successful CI run of a push to this repository's main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INPUT_VERSION: ${{ inputs.version }}
      NOTES: ${{ inputs.notes }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # The attestation names this ref; consumers accept only main.
      - name: Require main
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "release: runs only on refs/heads/main, not $GITHUB_REF" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      # Picks the commit (the tested one, or main's head for a manual run)
      # and its version, or the existing release to finish.
      - name: Choose commit
        id: plan
        run: |
          set -euo pipefail
          sha=${SHA:-$(git rev-parse HEAD)}
          if ! git merge-base --is-ancestor "$sha" HEAD; then
            echo "release: $sha is not on main" >&2
            exit 1
          fi
          tags=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          # v0.1.2 was released before the repository restarted (D196).
          highest=$({ echo v0.1.2; printf '%s\n' "$tags"; } | sed '/^$/d' | sort -V | tail -n 1)
          version=$INPUT_VERSION
          if [[ -n "$version" ]]; then
            if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "release: version must look like v1.2.3" >&2
              exit 1
            fi
            if git rev-parse --verify --quiet "refs/tags/$version" >/dev/null; then
              echo "release: tag $version exists; finishing its release"
              echo "VERSION=$version" >> "$GITHUB_ENV"
              echo "new=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            existing=$(git tag --points-at "$sha" --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)
            if [[ -n "$existing" ]]; then
              echo "release: $sha is tagged $existing; finishing its release"
              echo "VERSION=$existing" >> "$GITHUB_ENV"
              echo "new=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # A late run for a commit older than a released one releases nothing.
            for tag in $tags; do
              if git merge-base --is-ancestor "$sha" "refs/tags/$tag"; then
                echo "release: $tag already contains $sha; nothing to release"
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
            IFS=. read -r major minor patch <<<"${highest#v}"
            version="v$major.$minor.$((patch + 1))"
          fi
          if [[ "$(printf '%s\n%s\n' "$highest" "$version" | sort -V | tail -n 1)" != "$version" || "$version" == "$highest" ]]; then
            echo "release: $version is not higher than $highest" >&2
            exit 1
          fi
          echo "release: $version of $sha"
          git checkout --quiet --detach "$sha"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "new=true" >> "$GITHUB_OUTPUT"

      # No cache: a release is built from the tag and the module proxy only.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: steps.plan.outputs.skip != 'true'
        with:
          go-version-file: go.mod
          cache: false

      - name: Install golangci-lint
        if: steps.plan.outputs.new == 'true'
        run: |
          set -euo pipefail
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Check
        if: steps.plan.outputs.new == 'true'
        run: script/check.sh

      - name: Tag
        if: steps.plan.outputs.new == 'true'
        run: |
          set -euo pipefail
          git tag "$VERSION"
          git push origin "refs/tags/$VERSION"

      - name: Build
        if: steps.plan.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git checkout --quiet "refs/tags/$VERSION"
          script/release.sh "$VERSION"

      - name: Attest
        if: steps.plan.outputs.skip != 'true'
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/pimvault-*-linux-*

      # The same attestation as a release asset, for verifying offline.
      - name: Add attestation bundle
        if: steps.plan.outputs.skip != 'true'
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/pimvault-$VERSION.sigstore.json"

      # A run that stopped halfway can leave a draft with some assets: it
      # gets this build's assets, whose SHA256SUMS matches them, and is
      # published.
      - name: Publish
        if: steps.plan.outputs.skip != 'true'
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY/releases"
          id=$(gh api "$api" --paginate --jq ".[] | select(.tag_name == \"$VERSION\") | .id" | head -n 1)
          if [[ -z "$id" ]]; then
            if [[ -n "$NOTES" ]]; then
              printf '%s\n' "$NOTES" >"$RUNNER_TEMP/notes.md"
              notes=(--notes-file "$RUNNER_TEMP/notes.md")
            else
              notes=(--generate-notes)
            fi
            gh release create "$VERSION" --verify-tag --title "pimvault $VERSION" "${notes[@]}" dist/*
            exit 0
          fi
          have=$(gh api "$api/$id" --jq '.assets[].name' | sort)
          want=$(cd dist && ls | sort)
          if [[ "$have" != "$want" ]]; then
            gh release upload "$VERSION" --clobber dist/*
          fi
          if [[ "$(gh api "$api/$id" --jq .draft)" == true ]]; then
            gh api -X PATCH "$api/$id" -F draft=false >/dev/null
          fi
          echo "release: $VERSION is published"
