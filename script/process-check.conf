# Settings for script/process-check and script/pr-check. One `key = value` per line; lists are
# space-separated globs (* and ? stay inside a path segment, ** crosses segments, a leading **/
# also matches the root). Keys left out take the defaults shown in script/process-check.

# Requirement IDs, as a Python regex. Declared in requirement files as `- **<ID>** ...`.
id_regex = PV-[0-9]{3}

# Files that declare requirements.
requirements = docs/requirements*.md

# Test files. pr-check requires a `fix` PR to touch one. Go tests (unit and e2e) only.
tests = **/*_test.go

# Files searched for `Validates: <ID>` tags: the tests, and the release workflow, whose verify
# step checks every published release (not a test file, so a `fix` PR can't satisfy pr-check by
# touching it).
validates = **/*_test.go .github/workflows/release.yml

# Docs whose relative links and cited paths must resolve.
docs = CLAUDE.md README.md docs/*.md docs/adr/*.md

# A backticked name without a slash counts as a cited file when it has one of these extensions;
# it must then be the name of some file in the repository.
cited_exts = md go sh yml yaml

# Regexes for backticked text that looks like a path but is not one in this repository (NNNN:
# placeholders such as `docs/adr/NNNN-title.md`; pkg/ and go.work: the layout ADR 0014 retired;
# /tmp and the XDG locations: paths on the user's machine; docs/plans: retired by ADR 0021).
ignore_paths = NNNN ^pkg/ ^go\.work$ ^docs/plans ^PRD\.md$ ^\.env\.example$ ^\.claude/skills ^GEMINI\.md$ settings\.local\.json$

# The former decision log's rows (D1-D203) and open decisions (O-rows), kept as aliases: a
# requirement or ADR declares them on an `Aliases:` line, and every one cited in code, tests or
# docs must be declared. Research notes are dated records and may cite retired O-rows.
alias_regex = [DO][0-9]{1,3}
aliases = docs/requirements.md docs/adr/*.md
alias_cited = **/*.go CLAUDE.md README.md docs/*.md docs/adr/*.md docs/research/api-quirks.md .github/workflows/*.yml .golangci.yml
