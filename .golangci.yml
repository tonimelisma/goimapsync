# Adapted from tonimelisma/onedrive-go. Linters enforce the standard Go rules,
# so AGENTS.md does not repeat them.
version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports

  settings:
    goimports:
      local-prefixes:
        - github.com/tonimelisma/pimvault

linters:
  default: none
  enable:
    - bodyclose
    - containedctx
    - copyloopvar
    - contextcheck
    - depguard
    - dogsled
    - dupl
    - durationcheck
    - errcheck
    - errname
    - errorlint
    - exhaustive
    - forbidigo
    - funlen
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - lll
    - loggercheck
    - misspell
    - mnd
    - nakedret
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - sloglint
    - staticcheck
    - tagliatelle
    - testifylint
    - thelper
    - unconvert
    - unparam
    - unused
    - whitespace
    - wrapcheck

  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment

    # Dependencies are an owner decision (docs/requirements.md D84, D85, D87,
    # D88, D90, D120, D121). Add a module here only after the owner approves it.
    depguard:
      rules:
        main:
          files:
            - "**/*.go"
          allow:
            - $gostd
            - github.com/tonimelisma/pimvault
            - github.com/stretchr/testify
            - golang.org/x/oauth2
            - github.com/emersion/go-imap/v2
            # go-imap's sign-in takes a go-sasl client (D84).
            - github.com/emersion/go-sasl
            - github.com/emersion/go-ical
            - github.com/emersion/go-vcard
            - github.com/spf13/cobra
            - github.com/spf13/pflag
            - github.com/BurntSushi/toml

    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^time\.Sleep$
          msg: use explicit test synchronization instead of wall-clock sleep

    gocyclo:
      min-complexity: 15

    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
      disabled-checks:
        - dupImport
        - ifElseChain
        - octalLiteral
        - paramTypeCombine
        - unnamedResult
        - whyNoLint
        - wrapperFunc
        - importShadow

    dupl:
      threshold: 100

    funlen:
      lines: 100
      statements: 50

    mnd:
      checks:
        - argument
        - case
        - condition
        - operation
        - return
        - assign
      ignored-numbers:
        - '0'
        - '1'
        - '2'
        - '3'
        - '200'
        - '201'
        - '400'
        - '401'
        - '403'
        - '404'
        - '429'
        - '500'

    goconst:
      min-len: 2
      min-occurrences: 2

    gosec:
      excludes:
        - G104

    lll:
      line-length: 140

    # Google's APIs spell "cancelled" with two Ls (event status values).
    misspell:
      locale: US
      ignore-rules:
        - cancelled

    nakedret:
      max-func-lines: 30

    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true

    staticcheck:
      checks: ["all", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022"]

    # Google and Microsoft APIs use camelCase JSON; config is TOML (D73).
    tagliatelle:
      case:
        rules:
          json: camel
          toml: snake

    unparam:
      check-exported: false

    whitespace:
      multi-if: false
      multi-func: false

    exhaustive:
      default-signifies-exhaustive: false

    errcheck:
      check-type-assertions: true
      check-blank: true

    # pimvault's own packages wrap errors at their boundary ("verb noun: %w",
    # once per boundary), so callers inside the module return them as is.
    wrapcheck:
      ignore-package-globs:
        - github.com/tonimelisma/pimvault/*

  exclusions:
    generated: lax
    warn-unused: true
    rules:
      - linters:
          - gocritic
        text: "unnecessaryDefer:"
      - linters:
          - lll
        path: _test\.go
      # Table-driven tests repeat literal inputs and expectations on purpose.
      - linters:
          - goconst
        path: _test\.go
      # Fake providers for tests (such as internal/gmail/gmailtest) spell out
      # API field names the way the real API sends them.
      - linters:
          - goconst
          - gocyclo
          - gocritic
        path: test/[^/]+\.go
      # The live test-data seeder spells out API field names and fixed test
      # data the way the providers take them.
      - linters:
          - goconst
          - gochecknoglobals
          - gocritic
          - gocyclo
          - lll
          - mnd
        path: script/live/
      # Reader-side defer-close in tests only; production code checks Close()
      # on anything written to.
      - path: _test\.go
        linters:
          - errcheck
        source: "defer "
      # The sleep ban applies to tests only.
      - path-except: _test\.go
        linters:
          - forbidigo
        text: use explicit test synchronization instead of wall-clock sleep
